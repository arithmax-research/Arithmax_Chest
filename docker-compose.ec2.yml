services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: arithmax_chest-api:latest
    container_name: achest-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    environment:
      EULERPOOL_API_KEY: ${EULERPOOL_API_KEY:-}
      DATA_API_TOKEN: ${DATA_API_TOKEN:-}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.us}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_SECRET_KEY: ${BINANCE_SECRET_KEY:-}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      MASSIVE_ACCESS_KEY_ID: ${MASSIVE_ACCESS_KEY_ID:-}
      MASSIVE_SECRET_ACCESS_KEY: ${MASSIVE_SECRET_ACCESS_KEY:-}
      MASSIVE_S3_ENDPOINT: ${MASSIVE_S3_ENDPOINT:-https://files.massive.com}
      MASSIVE_S3_BUCKET: ${MASSIVE_S3_BUCKET:-flatfiles}
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      QUANDL_API_KEY: ${QUANDL_API_KEY:-}
    networks:
      - default
      - proxy

networks:
  default:
    name: achest_default
  proxy:
    name: caddy-central_proxy
    external: true
