[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmaxchest"
version = "0.1.1"
description = "Normalized multi-asset market-data API and Python client with provider routing and export tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arithmax" }]
keywords = ["finance", "market-data", "api", "ohlcv", "time-series", "provider-routing", "python"]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
futures = ["databento>=0.79"]
server = ["uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0"]
all = [
    "yfinance>=0.2.40",
    "databento>=0.79",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
include = ["achest*"]
